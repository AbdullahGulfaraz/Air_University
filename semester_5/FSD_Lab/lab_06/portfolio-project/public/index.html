<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Personal Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="navbar">
            <div class="nav-brand" id="brand-name">Portfolio</div>
            <button class="btn" id="open-profile-modal">Edit Profile</button>
        </header>

        <!-- Profile Section -->
        <section class="hero" id="hero-section">
            <img src="https://via.placeholder.com/140" alt="Avatar" class="profile-avatar" id="avatar-img">
            <div>
                <h1 id="hero-name">Loading...</h1>
                <h3 id="hero-headline" style="color: var(--accent); margin: 0.3rem 0;"></h3>
                <p id="hero-bio" style="color: var(--text-dim); margin: 0.8rem 0;"></p>
                <div id="hero-links">
                    <a id="hero-email" class="tag" href="#">Email</a>
                    <a id="hero-github" class="tag" href="#" target="_blank">GitHub</a>
                    <a id="hero-linkedin" class="tag" href="#" target="_blank">LinkedIn</a>
                </div>
            </div>
        </section>

        <!-- Skills Section -->
        <section>
            <div class="section-title">
                <span>Technical Skills</span>
                <button class="btn" onclick="openAddModal('skill')">+ Add Skill</button>
            </div>
            <div class="grid-2" id="skills-container"></div>
        </section>

        <!-- Experience Section -->
        <section>
            <div class="section-title">
                <span>Professional Experience</span>
                <button class="btn" onclick="openAddModal('experience')">+ Add Experience</button>
            </div>
            <div class="grid-2" id="experience-container"></div>
        </section>

        <!-- Projects Section -->
        <section>
            <div class="section-title">
                <span>Projects</span>
                <button class="btn" onclick="openAddModal('project')">+ Add Project</button>
            </div>
            <div class="grid-2" id="projects-container"></div>
        </section>

        <!-- Education Section -->
        <section>
            <div class="section-title">
                <span>Education</span>
                <button class="btn" onclick="openAddModal('education')">+ Add Education</button>
            </div>
            <div class="grid-2" id="education-container"></div>
        </section>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal" id="profile-modal">
        <div class="modal-content">
            <h2>Edit Portfolio Details</h2>
            <form id="profile-form" enctype="multipart/form-data" style="margin-top: 1rem;">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="full_name" id="input-name" required>
                </div>
                <div class="form-group">
                    <label>Headline</label>
                    <input type="text" name="headline" id="input-headline" required>
                </div>
                <div class="form-group">
                    <label>Bio</label>
                    <textarea name="bio" id="input-bio" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" id="input-email">
                </div>
                <div class="form-group">
                    <label>GitHub Profile URL</label>
                    <input type="url" name="github" id="input-github">
                </div>
                <div class="form-group">
                    <label>LinkedIn Profile URL</label>
                    <input type="url" name="linkedin" id="input-linkedin">
                </div>
                <div class="form-group">
                    <label>Profile Picture</label>
                    <input type="file" name="profile_image" id="input-image" accept="image/*">
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn" style="background: transparent; color: #fff; border: 1px solid var(--border-color);" onclick="$('#profile-modal').fadeOut()">Cancel</button>
                    <button type="submit" class="btn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Generic Modal for Adding Items (CLO-3 Component Reusability) -->
    <div class="modal" id="item-modal">
        <div class="modal-content">
            <h2 id="modal-heading">Add Entry</h2>
            <form id="item-form" style="margin-top: 1rem;">
                <div id="dynamic-fields"></div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1rem;">
                    <button type="button" class="btn" style="background: transparent; color: #fff; border: 1px solid var(--border-color);" onclick="$('#item-modal').fadeOut()">Cancel</button>
                    <button type="submit" class="btn">Add Item</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
